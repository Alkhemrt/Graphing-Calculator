<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Graphing Calculator</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <div class="container-fluid vh-100">
            <div class="row h-100">

                <div class="col-3 left-panel p-3">

                    <h5 class="mb-3">Graphing Calculator</h5>
                    <div id="equationContainer"></div>
                    <div class="error" id="errorMsg">Please enter a valid equation</div>

                    <div class="button-container">
                        <button id="addEquation" class="btn btn-sm btn-secondary">+ Add</button>
                        <button id="plotEquation" class="btn btn-sm btn-secondary">Plot</button>
                    </div>

                </div>

                <div class="col-9 p-0">
                    <canvas id="graphCanvas"></canvas>
                </div>

            </div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
